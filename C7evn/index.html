<style>

    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: .07;

  /* Hard extruded 3D shadow — the core depth language of the site */
  .extrude { box-shadow: 1px 1px 0 #4a0006, 2px 2px 0 #4a0006, 3px 3px 0 #4a0006, 4px 4px 0 #4a0006, 5px 5px 0 #4a0006, 6px 6px 0 #4a0006; transition: transform .15s ease, box-shadow .15s ease; }
  .extrude:hover { transform: translate(-2px,-2px); box-shadow: 1px 1px 0 #4a0006, 2px 2px 0 #4a0006, 3px 3px 0 #4a0006, 4px 4px 0 #4a0006, 5px 5px 0 #4a0006, 6px 6px 0 #4a0006, 7px 7px 0 #4a0006, 8px 8px 0 #4a0006; }

  .extrude-ghost { box-shadow: 1px 1px 0 #333, 2px 2px 0 #333, 3px 3px 0 #333, 4px 4px 0 #333, 5px 5px 0 #333, 6px 6px 0 #333; transition: transform .15s ease, box-shadow .15s ease; }

    background-image: linear-gradient(180deg, #ffffff 0%, #e6e9ec 55%, #c9ced4 100%);

    filter: drop-shadow(1px 1px 0 #5c6167) drop-shadow(1px 1px 0 #2e3136);
  }
  @keyframes gemText { from { background-position: 100% 0; } to { background-position: -120% 0; } }

  :where(.extrude.bg-blood, .extrude-ghost.border-bone\/80) { position: relative; }
  .extrude.bg-blood, .extrude-ghost.border-bone\/80 { overflow: hidden; isolation: isolate; }

    background-color: #9f060a;
    background-image:
      linear-gradient(180deg, #9c0c17 0%, #8a0913 55%, #760710 100%);

    text-shadow: 0 1px 0 #1c0605, 0 0 3px #1c0605, 0 0 12px rgba(28,6,5,.85);

  .extrude-ghost.border-bone\/80 {
    color: #0A0A0A !important; border-color: transparent !important; font-weight: 600;
    background-color: #b8bec6;
    background-image:
      linear-gradient(180deg, #e4e7ea 0%, #d3d8dc 55%, #c2c8ce 100%);
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  /* facetten: afgeschuinde randen (trapgeslepen) + dunne rosé-zilveren zetting */
  .extrude.bg-blood::before, .extrude-ghost.border-bone\/80::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    border: 2px solid; border-color: #b0222f #6e0610 #3a0005 #8e101b;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .extrude-ghost.border-bone\/80::before { border-color: #f3f5f7 #a9b0b9 #5c6167 #d6dbe0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  /* glans die over de steen glijdt */
  .extrude.bg-blood::after, .extrude-ghost.border-bone\/80::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,.12) 48%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.12) 52%, transparent 60%) no-repeat;
    background-size: 250% 100%; mix-blend-mode: screen;
    animation: none; opacity: 0;
  }
  @keyframes gemShine { 0% { background-position: 160% 0; } 45%, 100% { background-position: -60% 0; } }

  .slab-3d { text-shadow: 1px 1px 0 #5C2320, 2px 2px 0 #5C2320, 3px 3px 0 #4E1D1A, 4px 4px 0 #431916, 5px 5px 0 #331412, 6px 6px 14px rgba(0,0,0,.8); }

  /* 3D tilt surfaces */
  .tilt-stage { perspective: 1100px; }
  .tilt { transform-style: preserve-3d; transition: transform .25s ease-out; will-change: transform; }
  .tilt .pop { transform: translateZ(40px); }



  /* frame with red corner ticks */
  .frame { position: relative; border: 1px solid #262626; background: #0d0d0d; }
  /* robijnrode hoeken, zelfde geslepen stijl als de knoppen */
  .frame::before, .frame::after { content: ""; position: absolute; width: 24px; height: 24px; border-style: solid; z-index: 3; pointer-events: none; filter: drop-shadow(1px 1px 0 #4a0006) drop-shadow(2px 2px 0 #4a0006); }
  .frame::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-image: linear-gradient(135deg, #ff6b7b 0%, #d0142a 35%, #9f060a 70%, #5a0004 100%) 1; }
  .frame::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-image: linear-gradient(135deg, #ff5a6c 0%, #ba0d1a 40%, #7a0208 75%, #3a0003 100%) 1; }

  .duo img { filter: grayscale(1) contrast(1.15) brightness(.85); transition: filter .4s ease, transform .6s ease; }
  .duo::after { content: ""; position: absolute; inset: 0; background: #7A2B27; mix-blend-mode: multiply; opacity: .35; transition: opacity .4s ease; pointer-events: none; }
  .duo:hover img { filter: grayscale(.2) contrast(1.1) brightness(.95); transform: scale(1.04); }
  .duo:hover::after { opacity: .1; }

  .scanlines::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); }

  /* marquee: right → left */
  .marquee { mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }

  .marquee:hover .marquee-track, .marquee:focus-within .marquee-track { animation-play-state: paused; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .field { background: #0d0d0d; border: 1px solid #2e2e2e; color: #F3F3F3; transition: border-color .15s, box-shadow .15s; }

      <div class="flex flex-col justify-center px-4 sm:px-10 lg:px-12 xl:px-16 py-12 lg:py-16">
        <a href="index.html#artists" class="self-start font-mono text-[11px] tracking-[.25em] uppercase text-ash hover:text-bone min-h-[44px] flex items-center">← Alle artiesten</a>
        <h1 class="mt-4 font-slab uppercase leading-[.9] text-[clamp(3.2rem,12vw,7rem)] break-words"><span class="gem-text">${esc(a.name)}</span></h1>
        <p class="mt-4 font-mono text-sm tracking-[.2em] text-blood">${esc(a.handle)}</p>
        <p class="mt-6 max-w-md text-ash text-lg leading-relaxed">${esc(a.tagline)}</p>
        <div class="mt-10 max-w-md flex flex-col gap-4">
          <div data-dd>
            <button type="button" aria-expanded="false" aria-controls="dd-release" class="w-full bg-blood text-bone px-6 min-h-[60px] flex items-center justify-between gap-6 extrude text-left">
              <span class="flex items-center gap-4 min-w-0">
                <span class="w-0 h-0 shrink-0 border-y-[7px] border-y-transparent border-l-[11px] border-l-bone" aria-hidden="true"></span>
                <span class="min-w-0"><span class="block font-mono text-[10px] tracking-[.25em] uppercase text-bone/70">Nu te beluisteren</span><span class="block font-slab text-lg uppercase truncate">${esc(a.release.title)}</span></span>
              </span>
              <span class="flex items-center gap-2 font-mono text-xs tracking-[.2em] uppercase shrink-0">Luister<svg class="dd-caret w-3 h-3 transition-transform" viewBox="0 0 12 8" aria-hidden="true"><path d="M0 0h12L6 8z" fill="currentColor"/></svg></span>
            </button>
            <ul id="dd-release" class="dd-panel grid grid-rows-[0fr] transition-[grid-template-rows] duration-300">
              <li class="overflow-hidden"><div class="mt-2 border border-line bg-black divide-y divide-line">
                ${(a.platforms || []).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener" tabindex="-1" class="group flex items-center gap-4 px-4 min-h-[52px] hover:bg-coal transition-colors">
                  ${icon(n)}<span class="flex-1 text-sm font-medium">${esc(n)}</span><span class="font-mono text-xs text-ash group-hover:text-blood" aria-hidden="true">→</span>
                </a>`).join('')}
              </div></li>
            </ul>
          </div>
          <a href="${esc(a.instagram)}" target="_blank" rel="noopener" class="bg-black border border-bone/80 text-bone font-mono text-sm tracking-[.2em] uppercase px-6 min-h-[56px] flex items-center justify-center extrude-ghost">Instagram</a>
        </div>
      </div>
    </div>
  </section>

  ${a.feature ? `
  <!-- Feature photo -->
  <section class="bg-black border-t border-line py-16 md:py-24">
    <figure class="reveal max-w-5xl mx-auto px-4 sm:px-6">
      <div class="frame p-2 sm:p-3">
        <img src="${a.feature.img}" alt="${esc(a.name)} — ${esc(a.feature.caption)}" loading="lazy" width="1254" height="1254" class="pop-flat block w-full h-auto">
      </div>
      <figcaption class="mt-4 flex justify-between items-center font-mono text-[11px] tracking-[.25em] uppercase">
        <span>${esc(a.feature.caption)}</span><span class="text-blood">${esc(a.name)}</span>
      </figcaption>
    </figure>
  </section>` : ''}

  <!-- Bio -->
  <section class="py-20 md:py-28 border-t border-line bg-ink">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 grid lg:grid-cols-[320px_1fr] gap-12 lg:gap-20">
      <aside class="reveal lg:sticky lg:top-28 self-start">
        <p class="font-mono text-xs tracking-[.35em] text-blood uppercase">Profiel</p>
        <dl class="mt-6 font-mono text-sm divide-y divide-line border-y border-line">
          ${a.facts.map(([k, v]) => `<div class="flex justify-between gap-6 py-4"><dt class="text-ash tracking-[.2em] uppercase text-xs">${esc(k)}</dt><dd class="text-right">${esc(v)}</dd></div>`).join('')}
        </dl>
      </aside>
      <article class="reveal">
        <p class="font-mono text-xs tracking-[.35em] text-blood uppercase">Biografie</p>
        <h2 class="mt-3 font-slab text-4xl sm:text-5xl md:text-6xl uppercase slab-3d">Het verhaal</h2>
        <div class="mt-10 space-y-6 text-ash text-base sm:text-lg leading-relaxed">
          <p class="text-bone text-lg sm:text-xl">${esc(a.bio[0])}</p>
          ${a.bio.slice(1, 2).map(p => `<p>${esc(p)}</p>`).join('')}
          <blockquote class="my-10 border-l-4 border-blood pl-6 py-2 font-slab text-2xl sm:text-3xl uppercase leading-tight text-bone">“${esc(a.quote)}”</blockquote>
          ${a.bio.slice(2).map(p => `<p>${esc(p)}</p>`).join('')}
        </div>
      </article>
    </div>
  </section>

  <!-- CTA + next -->
  <section class="border-t border-line bg-ink">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-16 md:py-20 grid md:grid-cols-2 gap-6 md:gap-8">
      <a href="Boekingen/" class="reveal frame p-8 md:p-10 flex flex-col justify-between min-h-[200px] extrude-ghost group">
        <span class="font-mono text-xs tracking-[.35em] text-blood uppercase">Pers & Boekingen</span>
        <span class="mt-6 font-slab text-3xl md:text-4xl uppercase leading-tight">Boek ${esc(a.name)} <span class="text-blood">→</span></span>
      </a>
      <a href="${other[0]}/" class="reveal frame relative overflow-hidden min-h-[200px] flex items-end extrude-ghost group">
        <img src="${other[1].img}" alt="" class="absolute inset-0 w-full h-full object-cover object-[center_20%] opacity-50 group-hover:opacity-70 transition-opacity">
        <span class="relative p-8 md:p-10">
          <span class="block font-mono text-xs tracking-[.35em] text-bone uppercase">Volgende artiest</span>
          <span class="mt-3 block font-slab text-3xl md:text-4xl uppercase">${esc(other[1].name)} →</span>
        </span>
      </a>
    </div>
  </section>`;

  // Streaming-dropdown
  const setDD = (dd, open) => {
    dd.querySelector('button').setAttribute('aria-expanded', open);
    dd.querySelector('.dd-panel').classList.toggle('grid-rows-[1fr]', open);
    dd.querySelector('.dd-panel').classList.toggle('grid-rows-[0fr]', !open);
    dd.querySelector('.dd-caret').classList.toggle('rotate-180', open);
    $$('.dd-panel a', dd).forEach(l => l.tabIndex = open ? 0 : -1);
  };
  $$('[data-dd]').forEach(dd => dd.querySelector('button').addEventListener('click', e => {
    e.stopPropagation();
    setDD(dd, dd.querySelector('button').getAttribute('aria-expanded') !== 'true');
  }));
  document.addEventListener('click', e => { if (!e.target.closest('[data-dd]')) $$('[data-dd]').forEach(o => setDD(o, false)); });
  addEventListener('keydown', e => { if (e.key === 'Escape') $$('[data-dd]').forEach(o => setDD(o, false)); });

  // ---------- Header on scroll ----------
  const burger = $('#burger'), menu = $('#mobileMenu');
  const header = $('[data-header]');
  const onScroll = () => {
    const s = scrollY > 20;
    const open = menu.classList.contains('open');
    header.classList.toggle('bg-black', !s || open);
    header.classList.toggle('scrolled', s && !open);
  };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  // ---------- Mobile menu ----------
  const setMenu = open => {
    burger.classList.toggle('open', open); menu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open); menu.setAttribute('aria-hidden', !open);
    document.body.style.overflow = open ? 'hidden' : '';
    onScroll();
  };
  burger.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
  $$('.mnav').forEach(a => a.addEventListener('click', () => setMenu(false)));
  addEventListener('keydown', e => e.key === 'Escape' && setMenu(false));
  matchMedia('(min-width: 768px)').addEventListener('change', e => e.matches && setMenu(false));

  // ---------- 3D tilt (pointer devices only) ----------
  if (fine && !reduce) {
    $$('[data-tilt-stage]').forEach(stage => {
      const el = $('[data-tilt]', stage), max = +el.dataset.tiltMax || 8;
      stage.addEventListener('pointermove', e => {
        const r = stage.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        el.style.transform = `rotateY(${x * max * 2}deg) rotateX(${-y * max * 2}deg)`;
      });
      stage.addEventListener('pointerleave', () => el.style.transform = '');
    });
  }

  // ---------- Reveal on scroll ----------
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  $$('.reveal').forEach(el => io.observe(el));

  $('#year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
